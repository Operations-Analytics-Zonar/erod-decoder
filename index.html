<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EROD Decoder — FMCSA ELD File Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ===== IGNITION DESIGN TOKENS — Dark (default) ===== */
:root{
  /* Background / Surface */
  --ig-bg:#0F141C;
  --ig-surface:#161C27;
  --ig-surface-raised:#1E2532;
  --ig-surface-hover:rgba(255,255,255,.04);
  --ig-border:#252D3C;
  --ig-border-light:#1E2532;
  --ig-border-strong:#3A4559;

  /* Foreground */
  --ig-fg1:#EEF2FA;
  --ig-fg2:#8891A5;
  --ig-fg3:#5C6478;

  /* Primary action */
  --ig-primary:#005BF8;
  --ig-primary-hover:#1A6FFF;
  --ig-primary-light:rgba(0,91,248,.15);
  --ig-primary-foreground:#FFFFFF;

  /* Semantic status */
  --ig-success:#2E7D32;
  --ig-success-light:rgba(46,125,50,.15);
  --ig-warning:#FFB300;
  --ig-warning-light:rgba(255,179,0,.15);
  --ig-error:#D32F2F;
  --ig-error-light:rgba(211,47,47,.12);
  --ig-info:#00AEEF;
  --ig-info-light:rgba(0,174,239,.15);

  /* Brand palette */
  --ig-brand-operator-green:#66AE00;
  --ig-brand-true-blue:#00AEEF;
  --ig-brand-power-purple:#8400FF;
  --ig-brand-safety-yellow:#FFD800;

  /* Typography */
  --ig-font:'Roboto',system-ui,sans-serif;
  --ig-font-mono:'Roboto Mono',ui-monospace,monospace;
  --ig-fs-xs:11px;--ig-fs-sm:12px;--ig-fs-md:14px;
  --ig-fs-lg:16px;--ig-fs-xl:18px;--ig-fs-2xl:24px;--ig-fs-3xl:32px;
  --ig-fw-regular:400;--ig-fw-medium:500;
  --ig-fw-semibold:600;--ig-fw-bold:700;
  --ig-lh-tight:1.25;--ig-lh-normal:1.5;

  /* Spacing */
  --ig-sp-xs:4px;--ig-sp-sm:8px;--ig-sp-base:12px;
  --ig-sp-md:16px;--ig-sp-lg:24px;--ig-sp-xl:32px;--ig-sp-3xl:48px;

  /* Radii */
  --ig-radius-sm:4px;--ig-radius:8px;
  --ig-radius-lg:12px;--ig-radius-full:999px;

  /* Shadows */
  --ig-shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --ig-shadow-md:0 4px 6px rgba(0,0,0,.07);
  --ig-shadow-lg:0 10px 15px rgba(0,0,0,.10);

  /* Control heights */
  --ig-h-sm:32px;--ig-h-md:40px;--ig-h-lg:48px;

  /* Focus / overlay */
  --ig-focus-ring:0 0 0 3px rgba(0,91,248,.45);
  --ig-overlay:rgba(0,0,0,.4);

  /* Duty status — brand data-viz palette */
  --off-duty:#66AE00;
  --off-duty-dim:rgba(102,174,0,.15);
  --sleeper:#00AEEF;
  --sleeper-dim:rgba(0,174,239,.15);
  --driving:#D32F2F;
  --driving-dim:rgba(211,47,47,.12);
  --on-duty:#FFB300;
  --on-duty-dim:rgba(255,179,0,.12);
  --cert:#8400FF;
  --cert-dim:rgba(132,0,255,.10);
  --malf:#D32F2F;
  --login:#00AEEF;
  --engine:#FFB300;
}

html{scroll-behavior:smooth}
body{
  font-family:var(--ig-font);
  background:var(--ig-bg);
  color:var(--ig-fg1);
  line-height:var(--ig-lh-normal);
  min-height:100vh;
}
::selection{background:var(--ig-primary-light)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--ig-surface)}
::-webkit-scrollbar-thumb{background:var(--ig-border-strong);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ig-fg3)}

/* ===== DROP ZONE ===== */
#drop-zone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:var(--ig-sp-3xl) var(--ig-sp-lg);
  cursor:pointer;position:relative;
}
#drop-zone::before{
  content:'';position:absolute;inset:var(--ig-sp-xl);
  border:1.5px dashed var(--ig-border-strong);
  border-radius:var(--ig-radius-lg);
  transition:border-color .15s ease,inset .15s ease;
  pointer-events:none;
}
#drop-zone.dragover::before{
  border-color:var(--ig-primary);
  inset:calc(var(--ig-sp-xl) - 4px);
}
.drop-icon{
  color:var(--ig-fg3);
  margin-bottom:var(--ig-sp-lg);
  transition:color .15s ease;
}
#drop-zone.dragover .drop-icon{color:var(--ig-primary)}
#drop-zone h1{
  font-size:var(--ig-fs-3xl);
  font-weight:var(--ig-fw-bold);
  line-height:var(--ig-lh-tight);
  letter-spacing:-.02em;
  color:var(--ig-fg1);
  margin-bottom:var(--ig-sp-sm);
}
#drop-zone p{
  color:var(--ig-fg3);
  font-size:var(--ig-fs-md);
  margin-bottom:var(--ig-sp-xl);
}
#file-input{display:none}
.btn{
  display:inline-flex;align-items:center;gap:var(--ig-sp-sm);
  height:var(--ig-h-md);
  padding:0 var(--ig-sp-md);
  background:var(--ig-primary);
  color:var(--ig-primary-foreground);
  border:none;
  border-radius:var(--ig-radius);
  font-family:var(--ig-font);
  font-size:var(--ig-fs-md);
  font-weight:var(--ig-fw-semibold);
  cursor:pointer;
  transition:background .15s ease;
}
.btn:hover{background:var(--ig-primary-hover)}
.version-tag{
  position:absolute;bottom:var(--ig-sp-md);left:50%;transform:translateX(-50%);
  font-family:var(--ig-font-mono);font-size:var(--ig-fs-xs);
  color:var(--ig-fg3);letter-spacing:.06em;text-transform:uppercase;
}

/* ===== MAIN CONTENT ===== */
#content{display:none;padding:0 var(--ig-sp-md) 60px;max-width:1440px;margin:0 auto}

/* Topbar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--ig-sp-md) 0;
  margin-bottom:var(--ig-sp-sm);
  border-bottom:1px solid var(--ig-border);
  position:sticky;top:0;z-index:50;
  background:var(--ig-bg);
}
.topbar-left{display:flex;align-items:center;gap:var(--ig-sp-base)}
.topbar-brand{
  font-size:var(--ig-fs-lg);
  font-weight:var(--ig-fw-semibold);
  color:var(--ig-fg1);
  letter-spacing:-.01em;
}
.topbar-sep{width:1px;height:20px;background:var(--ig-border)}
.topbar-file{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-sm);
  color:var(--ig-fg3);
  letter-spacing:.02em;
  background:var(--ig-surface);
  padding:5px var(--ig-sp-base);
  border-radius:var(--ig-radius-sm);
  border:1px solid var(--ig-border);
}
.btn-ghost{
  display:inline-flex;align-items:center;gap:var(--ig-sp-xs);
  height:var(--ig-h-sm);
  padding:0 var(--ig-sp-md);
  background:transparent;
  color:var(--ig-fg2);
  border:1px solid var(--ig-border);
  border-radius:var(--ig-radius);
  font-family:var(--ig-font);
  font-size:var(--ig-fs-sm);
  font-weight:var(--ig-fw-medium);
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.btn-ghost:hover{
  color:var(--ig-fg1);
  border-color:var(--ig-border-strong);
  background:var(--ig-surface-hover);
}

/* ===== HEADER CARD ===== */
.header-card{
  background:var(--ig-surface);
  border:1px solid var(--ig-border);
  border-radius:var(--ig-radius-lg);
  padding:0;
  margin-bottom:var(--ig-sp-md);
  overflow:hidden;
}
.header-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--ig-sp-md) var(--ig-sp-lg);
  border-bottom:1px solid var(--ig-border);
}
.header-driver{display:flex;align-items:center;gap:var(--ig-sp-sm)}
.driver-avatar{
  width:44px;height:44px;
  border-radius:var(--ig-radius-full);
  background:var(--ig-primary);
  display:flex;align-items:center;justify-content:center;
  font-weight:var(--ig-fw-bold);
  font-size:var(--ig-fs-lg);
  color:var(--ig-primary-foreground);
  flex-shrink:0;
}
.driver-name{
  font-size:var(--ig-fs-xl);
  font-weight:var(--ig-fw-semibold);
  letter-spacing:-.01em;
  color:var(--ig-fg1);
}
.driver-carrier{font-size:var(--ig-fs-sm);color:var(--ig-fg2);margin-top:2px}
.header-eld-badge{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  color:var(--ig-primary);
  background:var(--ig-primary-light);
  padding:4px var(--ig-sp-base);
  border-radius:var(--ig-radius-full);
  border:1px solid rgba(0,91,248,.2);
  letter-spacing:.04em;
  text-transform:uppercase;
}
.header-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  padding:var(--ig-sp-md) var(--ig-sp-lg);
  gap:0;
}
.header-field{
  padding:var(--ig-sp-sm) 0;
  border-bottom:1px solid var(--ig-border);
  display:flex;flex-direction:column;gap:2px;
}
.header-field:nth-last-child(-n+4){border-bottom:none}
.header-field label{
  font-size:var(--ig-fs-xs);
  color:var(--ig-fg3);
  text-transform:uppercase;
  letter-spacing:.6px;
  font-weight:var(--ig-fw-semibold);
}
.header-field span{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-sm);
  font-weight:var(--ig-fw-medium);
  color:var(--ig-fg1);
}

/* ===== SUMMARY CARDS ===== */
.summary-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:var(--ig-sp-sm);
  margin-bottom:var(--ig-sp-md);
}
@media(max-width:900px){.summary-row{grid-template-columns:repeat(4,1fr)}}
.summary-card{
  background:var(--ig-surface);
  border:1px solid var(--ig-border);
  border-radius:var(--ig-radius);
  padding:var(--ig-sp-base) var(--ig-sp-sm);
  text-align:center;
  position:relative;overflow:hidden;
  transition:border-color .15s ease;
}
.summary-card:hover{border-color:var(--ig-border-strong)}
.summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.summary-card .num{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-2xl);
  font-weight:var(--ig-fw-bold);
  line-height:1.1;
}
.summary-card .lbl{
  font-size:var(--ig-fs-xs);
  color:var(--ig-fg3);
  margin-top:4px;
  text-transform:uppercase;
  letter-spacing:.6px;
  font-weight:var(--ig-fw-semibold);
}

/* ===== TABS ===== */
.tabs{
  display:flex;gap:2px;
  margin-bottom:var(--ig-sp-md);
  border-bottom:1px solid var(--ig-border);
  overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:var(--ig-sp-sm) var(--ig-sp-md);
  cursor:pointer;
  font-size:var(--ig-fs-sm);
  font-weight:var(--ig-fw-medium);
  color:var(--ig-fg3);
  background:transparent;border:none;
  border-bottom:2px solid transparent;
  transition:color .15s ease,border-color .15s ease;
  display:flex;align-items:center;gap:7px;
  white-space:nowrap;flex-shrink:0;
}
.tab:hover{color:var(--ig-fg2)}
.tab.active{color:var(--ig-fg1);border-bottom-color:var(--ig-primary)}
.tab .badge{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  background:var(--ig-surface-raised);
  padding:1px 7px;
  border-radius:var(--ig-radius-sm);
  color:var(--ig-fg3);
}
.tab.active .badge{background:var(--ig-primary);color:var(--ig-primary-foreground)}
.tab .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tab-panel{display:none;animation:fadeUp .2s ease}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ===== TABLES ===== */
.table-wrap{
  overflow-x:auto;
  border-radius:var(--ig-radius-lg);
  border:1px solid var(--ig-border);
  background:var(--ig-surface);
}
table{width:100%;border-collapse:collapse;font-size:var(--ig-fs-sm)}
th{
  background:var(--ig-surface-raised);
  padding:10px var(--ig-sp-base);
  text-align:left;
  font-weight:var(--ig-fw-semibold);
  font-size:var(--ig-fs-xs);
  text-transform:uppercase;
  letter-spacing:.6px;
  color:var(--ig-fg3);
  position:sticky;top:0;
  white-space:nowrap;
  border-bottom:1px solid var(--ig-border);
}
td{
  padding:var(--ig-sp-sm) var(--ig-sp-base);
  border-top:1px solid var(--ig-border);
  vertical-align:middle;
  font-size:var(--ig-fs-sm);
  color:var(--ig-fg1);
}
tbody tr{transition:background .1s ease}
tbody tr:hover{background:var(--ig-surface-hover)}
tbody tr:nth-child(even){background:rgba(255,255,255,.01)}
tbody tr:nth-child(even):hover{background:var(--ig-surface-hover)}

/* ===== BADGES ===== */
.status-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;
  border-radius:var(--ig-radius-full);
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  font-weight:var(--ig-fw-semibold);
  letter-spacing:.02em;white-space:nowrap;
}
.status-badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.status-off-duty{background:var(--off-duty-dim);color:var(--off-duty)}
.status-off-duty::before{background:var(--off-duty)}
.status-sleeper{background:var(--sleeper-dim);color:var(--sleeper)}
.status-sleeper::before{background:var(--sleeper)}
.status-driving{background:var(--driving-dim);color:var(--driving)}
.status-driving::before{background:var(--driving)}
.status-on-duty{background:var(--on-duty-dim);color:var(--on-duty)}
.status-on-duty::before{background:var(--on-duty)}
.status-active{background:var(--off-duty-dim);color:var(--off-duty)}
.status-active::before{background:var(--off-duty)}
.status-inactive{background:rgba(92,100,120,.12);color:var(--ig-fg3)}
.status-inactive::before{background:var(--ig-fg3)}
.status-certify{background:var(--cert-dim);color:var(--cert)}
.status-certify::before{background:var(--cert)}
.status-recertify{background:var(--ig-info-light);color:var(--login)}
.status-recertify::before{background:var(--login)}
.origin-auto{color:var(--ig-fg3)}
.origin-driver{color:var(--ig-primary)}
.origin-carrier{color:var(--on-duty)}
.origin-unid{color:var(--malf)}
.annotation-text{
  font-style:italic;color:var(--ig-fg2);
  font-size:var(--ig-fs-sm);
  max-width:220px;display:inline-block;
}
.coord{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  color:var(--ig-fg2);
  letter-spacing:.02em;
}
.cert-day{
  font-family:var(--ig-font-mono);
  font-weight:var(--ig-fw-bold);
  font-size:var(--ig-fs-sm);
  color:var(--cert);
  background:var(--cert-dim);
  padding:4px var(--ig-sp-base);
  border-radius:var(--ig-radius-sm);
  border:1px solid rgba(132,0,255,.15);
  letter-spacing:.03em;
}

/* ===== TIMELINE ===== */
.timeline-container{
  background:var(--ig-surface);
  border:1px solid var(--ig-border);
  border-radius:var(--ig-radius-lg);
  padding:var(--ig-sp-lg);
  overflow:hidden;
}
.timeline-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--ig-sp-md);flex-wrap:wrap;gap:var(--ig-sp-base);
}
.timeline-header-left{display:flex;align-items:center;gap:var(--ig-sp-base)}
.timeline-title{
  font-size:var(--ig-fs-md);
  font-weight:var(--ig-fw-semibold);
  color:var(--ig-fg1);
}
.view-toggle{
  display:flex;
  background:var(--ig-surface-raised);
  border-radius:var(--ig-radius);
  border:1px solid var(--ig-border);
  overflow:hidden;
}
.view-toggle button{
  font-family:var(--ig-font);
  font-size:var(--ig-fs-sm);
  font-weight:var(--ig-fw-medium);
  padding:5px var(--ig-sp-base);
  border:none;cursor:pointer;
  color:var(--ig-fg3);
  background:transparent;
  transition:color .15s ease,background .15s ease;
}
.view-toggle button:hover{color:var(--ig-fg2)}
.view-toggle button.active{background:var(--ig-primary);color:var(--ig-primary-foreground)}
.daily-nav{
  display:flex;align-items:center;gap:var(--ig-sp-sm);
  margin-bottom:var(--ig-sp-md);flex-wrap:wrap;
}
.daily-nav button{
  font-family:var(--ig-font);
  font-size:var(--ig-fs-sm);
  font-weight:var(--ig-fw-medium);
  height:var(--ig-h-sm);
  padding:0 var(--ig-sp-sm);
  border:1px solid var(--ig-border);
  border-radius:var(--ig-radius-sm);
  cursor:pointer;
  color:var(--ig-fg2);
  background:var(--ig-surface-raised);
  transition:border-color .15s ease,color .15s ease;
}
.daily-nav button:hover{border-color:var(--ig-border-strong);color:var(--ig-fg1)}
.daily-nav button.active{background:var(--ig-primary);color:var(--ig-primary-foreground);border-color:var(--ig-primary)}
.daily-nav button:disabled{opacity:.3;cursor:default}
.daily-detail{margin-top:var(--ig-sp-md)}
.daily-bar-wrap{position:relative;margin-bottom:var(--ig-sp-md)}
.daily-bar{
  height:48px;
  background:var(--ig-surface-raised);
  border-radius:var(--ig-radius-sm);
  position:relative;overflow:hidden;
  border:1px solid var(--ig-border);
}
.daily-bar .timeline-segment{height:100%}
.daily-axis{
  display:flex;justify-content:space-between;
  margin-top:4px;padding:0 1px;
}
.daily-axis span{
  font-family:var(--ig-font-mono);
  font-size:9px;color:var(--ig-fg3);letter-spacing:.04em;
}
.daily-events-list{margin-top:var(--ig-sp-base)}
.daily-event-row{
  display:flex;align-items:center;gap:var(--ig-sp-base);
  padding:var(--ig-sp-sm) var(--ig-sp-base);
  border-radius:var(--ig-radius-sm);
  transition:background .1s ease;
}
.daily-event-row:hover{background:var(--ig-surface-raised)}
.daily-event-time{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-sm);
  color:var(--ig-fg2);
  width:52px;flex-shrink:0;
  font-weight:var(--ig-fw-medium);
}
.daily-event-dur{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  color:var(--ig-fg3);width:56px;flex-shrink:0;
}
.daily-event-status{flex-shrink:0;width:160px}
.daily-event-loc{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  color:var(--ig-fg3);flex-shrink:0;
}
.daily-event-ann{
  font-size:var(--ig-fs-sm);
  color:var(--ig-fg2);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.daily-summary{
  display:flex;gap:var(--ig-sp-md);
  margin-top:var(--ig-sp-md);padding-top:var(--ig-sp-md);
  border-top:1px solid var(--ig-border);flex-wrap:wrap;
}
.daily-summary-item{display:flex;align-items:center;gap:var(--ig-sp-sm)}
.daily-summary-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.daily-summary-label{font-size:var(--ig-fs-sm);color:var(--ig-fg2)}
.daily-summary-value{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-sm);
  font-weight:var(--ig-fw-semibold);
  color:var(--ig-fg1);
}
.timeline-legend{display:flex;gap:var(--ig-sp-md);flex-wrap:wrap}
.legend-item{
  display:flex;align-items:center;gap:6px;
  font-size:var(--ig-fs-sm);
  color:var(--ig-fg2);cursor:default;
}
.legend-swatch{
  width:12px;height:12px;border-radius:3px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);
}
.timeline-axis{
  display:flex;align-items:flex-end;
  margin-left:100px;margin-bottom:6px;
  position:relative;height:18px;
}
.timeline-axis-tick{
  position:absolute;
  font-family:var(--ig-font-mono);
  font-size:9px;color:var(--ig-fg3);
  transform:translateX(-50%);letter-spacing:.04em;
}
.timeline-axis-line{
  position:absolute;bottom:0;width:1px;height:6px;
  background:var(--ig-border-strong);
  transform:translateX(-50%);
}
.timeline-day{
  display:flex;align-items:center;
  gap:var(--ig-sp-base);margin-bottom:4px;position:relative;
}
.timeline-label{
  width:88px;
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-sm);
  color:var(--ig-fg2);
  text-align:right;flex-shrink:0;
  font-weight:var(--ig-fw-medium);letter-spacing:.02em;
}
.timeline-bar{
  flex:1;height:32px;
  background:var(--ig-surface-raised);
  border-radius:var(--ig-radius-sm);
  position:relative;overflow:hidden;
  border:1px solid var(--ig-border);
}
.timeline-gridline{
  position:absolute;top:0;bottom:0;width:1px;
  background:var(--ig-border);opacity:.5;pointer-events:none;
}
.timeline-segment{
  position:absolute;top:0;height:100%;min-width:2px;
  transition:filter .15s ease;cursor:pointer;
}
.timeline-segment:hover{filter:brightness(1.2)}
.timeline-tooltip{
  display:none;
  position:absolute;bottom:calc(100% + 8px);
  left:50%;transform:translateX(-50%);z-index:20;
  background:var(--ig-surface-raised);
  border:1px solid var(--ig-border-strong);
  border-radius:var(--ig-radius);
  padding:10px var(--ig-sp-base);
  box-shadow:var(--ig-shadow-lg);
  min-width:180px;pointer-events:none;
}
.timeline-segment:hover .timeline-tooltip{display:block}
.timeline-tooltip .tt-status{
  display:flex;align-items:center;gap:6px;
  font-weight:var(--ig-fw-semibold);
  font-size:var(--ig-fs-sm);
  margin-bottom:6px;color:var(--ig-fg1);
}
.timeline-tooltip .tt-dot{width:8px;height:8px;border-radius:50%}
.timeline-tooltip .tt-detail{
  font-family:var(--ig-font-mono);
  font-size:var(--ig-fs-xs);
  color:var(--ig-fg2);
  line-height:var(--ig-lh-normal);
}

/* Malf */
.malf-malfunction{color:var(--malf);font-weight:var(--ig-fw-semibold)}
.malf-diagnostic{color:var(--on-duty);font-weight:var(--ig-fw-semibold)}

/* Empty state */
.empty{
  padding:var(--ig-sp-3xl);text-align:center;
  color:var(--ig-fg3);font-size:var(--ig-fs-md);
}
</style>

<body>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  <div class="drop-icon">
    <i data-lucide="file-text" style="width:56px;height:56px;stroke-width:1.5"></i>
  </div>
  <h1>EROD Decoder</h1>
  <p>Drop an FMCSA ELD output file here, or click to browse</p>
  <button class="btn" onclick="event.stopPropagation();document.getElementById('file-input').click()">
    <i data-lucide="upload" style="width:16px;height:16px"></i>
    Select file
  </button>
  <input type="file" id="file-input">
  <div class="version-tag">FMCSA 49 CFR Part 395</div>
</div>

<div id="content">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">EROD Decoder</span>
      <span class="topbar-sep"></span>
      <span class="topbar-file" id="file-name-display"></span>
    </div>
    <button class="btn-ghost" onclick="location.reload()">
      <i data-lucide="refresh-cw" style="width:13px;height:13px"></i>
      Load another file
    </button>
  </div>
  <div class="header-card" id="header-card"></div>
  <div class="summary-row" id="summary-row"></div>
  <div class="tabs" id="tabs"></div>
  <div id="tab-panels"></div>
</div>

<script>
// ========== CONSTANTS ==========
const EVENT_TYPES = {1:'Duty Status',2:'Intermediate',3:'Driver Indication'};
const DUTY_CODES = {1:'Off Duty',2:'Sleeper Berth',3:'Driving',4:'On Duty (Not Driving)'};
const DUTY_SHORT = {1:'OFF',2:'SB',3:'DR',4:'ON'};
const DUTY_CSS = {1:'off-duty',2:'sleeper',3:'driving',4:'on-duty'};
const DUTY_COLORS = {1:'var(--off-duty)',2:'var(--sleeper)',3:'var(--driving)',4:'var(--on-duty)'};
const DUTY_HEX = {1:'#66AE00',2:'#00AEEF',3:'#D32F2F',4:'#FFB300'};
const RECORD_STATUS = {1:'Active',2:'Inactive-Changed',3:'Inactive-Change Req',4:'Inactive-Change Rej'};
const RECORD_ORIGIN = {1:'Auto (ELD)',2:'Driver',3:'Motor Carrier',4:'Unidentified'};
const ORIGIN_CSS = {1:'origin-auto',2:'origin-driver',3:'origin-carrier',4:'origin-unid'};
const CERT_ACTIONS = {1:'Certify',2:'Recertify'};
const MALF_EVENT_TYPES = {3:'Data Diagnostic',4:'Malfunction'};
const MALF_CODES_DIAG = {1:'Power Data Diagnostic',2:'Engine Sync Data Diagnostic',3:'Missing Data Diagnostic',4:'Data Transfer Data Diagnostic',5:'Unidentified Driving Records',6:'Other'};
const MALF_CODES_MALF = {1:'Power Compliance',2:'Engine Sync Compliance',3:'Timing Compliance',4:'Positioning Compliance',5:'Data Recording Compliance',6:'Data Transfer Compliance',7:'Other'};
const ENGINE_TYPES = {1:'Shut Down',3:'Power Up'};
const LOGIN_TYPES = {1:'Login',2:'Logout'};

// ========== TIMEZONE ==========
let TZ_OFFSET_HOURS = -4;
const TZ_NAMES = {4:'ET',5:'CT',6:'MT',7:'PT',8:'AKT',10:'HT'};

function utcToLocal(d,t){
  if(!d||d.length!==6||!t||t.length!==6) return {date:d,time:t};
  const mm=parseInt(d.slice(0,2)),dd=parseInt(d.slice(2,4)),yy=parseInt(d.slice(4,6));
  const hh=parseInt(t.slice(0,2)),mi=parseInt(t.slice(2,4)),ss=parseInt(t.slice(4,6));
  const utc=new Date(Date.UTC(2000+yy,mm-1,dd,hh,mi,ss));
  utc.setUTCHours(utc.getUTCHours()+TZ_OFFSET_HOURS);
  const lm=String(utc.getUTCMonth()+1).padStart(2,'0');
  const ld=String(utc.getUTCDate()).padStart(2,'0');
  const ly=String(utc.getUTCFullYear()-2000).padStart(2,'0');
  const lh=String(utc.getUTCHours()).padStart(2,'0');
  const lmi=String(utc.getUTCMinutes()).padStart(2,'0');
  const ls=String(utc.getUTCSeconds()).padStart(2,'0');
  return {date:lm+ld+ly, time:lh+lmi+ls};
}

// ========== HELPERS ==========
function fmtDate(d){
  if(!d||d.length!==6) return d||'';
  return d.slice(0,2)+'/'+d.slice(2,4)+'/20'+d.slice(4,6);
}
function fmtDateShort(d){
  if(!d||d.length!==6) return d||'';
  return d.slice(0,2)+'/'+d.slice(2,4);
}
function fmtTime(t){
  if(!t||t.length!==6) return t||'';
  return t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6);
}
function fmtTimeShort(t){
  if(!t||t.length!==6) return t||'';
  return t.slice(0,2)+':'+t.slice(2,4);
}
function fmtLocalDate(d,t){const l=utcToLocal(d,t);return fmtDate(l.date);}
function fmtLocalDateShort(d,t){const l=utcToLocal(d,t);return fmtDateShort(l.date);}
function fmtLocalTime(d,t){const l=utcToLocal(d,t);return fmtTime(l.time);}
function fmtLocalTimeShort(d,t){const l=utcToLocal(d,t);return fmtTimeShort(l.time);}
function localTimeToMinutes(d,t){const l=utcToLocal(d,t);return timeToMinutes(l.time);}
function localDateStr(d,t){const l=utcToLocal(d,t);return l.date;}

function fmtCoord(v){
  if(!v||v==='X') return '-';
  return parseFloat(v).toFixed(2);
}
function timeToMinutes(t){
  if(!t||t.length!==6) return 0;
  return parseInt(t.slice(0,2))*60+parseInt(t.slice(2,4));
}
function minutesToTime(m){
  const h=String(Math.floor(m/60)).padStart(2,'0');
  const mm=String(m%60).padStart(2,'0');
  return h+':'+mm;
}
function durationStr(mins){
  const h=Math.floor(mins/60);const m=mins%60;
  return h>0?(h+'h '+(m>0?m+'m':'')):(m+'m');
}
function tzLabel(){
  const abs=Math.abs(TZ_OFFSET_HOURS);
  const name=TZ_NAMES[abs]||'';
  return name?name+' (UTC'+(TZ_OFFSET_HOURS>0?'+':'')+TZ_OFFSET_HOURS+'h)':'UTC'+(TZ_OFFSET_HOURS>0?'+':'')+TZ_OFFSET_HOURS+'h';
}

// ========== PARSER ==========
function parseEROD(rawText){
  const text = rawText.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const data = {header:{},users:[],cmvs:[],events:[],annotations:{},certifications:[],malfunctions:[],logins:[],engines:[],unidentified:[],checksum:''};
  const segLabels = [
    'ELD File Header Segment:','User List:','CMV List:','ELD Event List:',
    'ELD Event Annotations or Comments:',"Driver's Certification/Recertification Actions:",
    'Malfunctions and Data Diagnostic Events:','ELD Login/Logout Report:',
    'CMV Engine Power-Up and Shut Down Activity:','Unidentified Driver Profile Records:','End of File:'
  ];
  const segments = {};
  let remaining = text;
  for(let i=0;i<segLabels.length;i++){
    const label=segLabels[i],nextLabel=segLabels[i+1];
    const startIdx=remaining.indexOf(label);
    if(startIdx===-1) continue;
    const contentStart=startIdx+label.length;
    let contentEnd=nextLabel?remaining.indexOf(nextLabel,contentStart):-1;
    if(contentEnd===-1) contentEnd=remaining.length;
    segments[label]=remaining.slice(contentStart,contentEnd).trim();
  }

  // Header
  const hdrRaw=segments['ELD File Header Segment:'];
  if(hdrRaw){
    const hdrLines=hdrRaw.split('\n').filter(l=>l.trim());
    const allFields=[];
    for(const line of hdrLines){const parts=line.split(',');if(parts.length>1)parts.pop();allFields.push(...parts);}
    const h=allFields;
    data.header={
      lastName:h[0]||'',firstName:h[1]||'',eldId:h[2]||'',
      dlState:h[3]||'',dlNumber:h[4]||'',
      dotNumber:h[8]||'',vin:h[9]||'',truckNumber:h[10]||'',
      trailerNumber:h[11]||'',carrierName:h[12]||'',
      multiDay:h[13]||'',startHour:h[14]||'',timeZoneOffset:h[15]||'',
      shippingId:h[16]||'',recordCount:h[17]||'',
      eldRegistration:h[18]||'',outputFileDate:h[19]||'',
      codriverLast:h[20]||'',codriverFirst:h[21]||'',
      codriverAccumHours:h[23]||'',
      codriverFlag:(h[20]&&h[20]!=='X')?'1':'0',
      eldProvider:h[24]||'',eldFirmware:h[25]||'',certificate:h[26]||''
    };
    const tzVal=parseInt(data.header.timeZoneOffset)||4;
    TZ_OFFSET_HOURS=-tzVal;
  }
  // Users
  const uRaw=segments['User List:'];
  if(uRaw){
    const allParts=uRaw.replace(/\n/g,',').split(',').filter(p=>p.trim());
    let idx=0;if(allParts.length>0&&/^\d+$/.test(allParts[0].trim()))idx=1;
    while(idx+3<allParts.length){
      data.users.push({userId:allParts[idx].trim(),role:allParts[idx+1].trim(),lastName:allParts[idx+2].trim(),firstName:allParts[idx+3].trim()});
      idx+=4;
    }
  }
  // CMVs
  const cRaw=segments['CMV List:'];
  if(cRaw){
    const allParts=cRaw.replace(/\n/g,',').split(',').filter(p=>p.trim());
    let idx=0;if(allParts.length>0&&/^\d+$/.test(allParts[0].trim()))idx=1;
    while(idx+1<allParts.length){
      data.cmvs.push({dotNumber:allParts[idx].trim(),vin:allParts[idx+1].trim(),eventCount:allParts[idx+2]?.trim()||''});
      idx+=3;
    }
  }
  // Events
  const eRaw=segments['ELD Event List:'];
  if(eRaw){
    const lines=eRaw.split('\n').filter(l=>l.trim());
    for(const line of lines){
      const p=line.split(',');if(p.length<16)continue;
      data.events.push({
        seqId:p[0].trim(),recordStatus:parseInt(p[1]),recordOrigin:parseInt(p[2]),
        eventType:parseInt(p[3]),eventCode:parseInt(p[4]),
        date:p[5],time:p[6],accumMiles:p[7],accumHours:p[8],
        lat:p[9],lon:p[10],distSinceValid:p[11],
        cmvOrder:p[12]||'',userOrder:p[13]||'',
        malfIndicator:p[14]||'',dataDiagIndicator:p[15]||'',
        eventDataCheck:p[16]||'',lineDataCheck:p[17]||''
      });
    }
  }
  // Annotations
  const aRaw=segments['ELD Event Annotations or Comments:'];
  if(aRaw){
    const lines=aRaw.split('\n').filter(l=>l.trim());
    for(const line of lines){const p=line.split(',');if(p.length<5)continue;data.annotations[p[0].trim()]={userId:p[1],comment:p[2],date:p[3],time:p[4]};}
  }
  // Certifications
  const certRaw=segments["Driver's Certification/Recertification Actions:"];
  if(certRaw){
    const lines=certRaw.split('\n').filter(l=>l.trim());
    for(const line of lines){const p=line.split(',');if(p.length<6)continue;data.certifications.push({seqId:p[0].trim(),actionType:parseInt(p[1]),date:p[2],time:p[3],certifiedDate:p[4],actionCode:p[5],lineDataCheck:p[6]||''});}
  }
  // Malfunctions
  const mRaw=segments['Malfunctions and Data Diagnostic Events:'];
  if(mRaw){
    const lines=mRaw.split('\n').filter(l=>l.trim());
    for(const line of lines){const p=line.split(',');if(p.length<8)continue;data.malfunctions.push({seqId:p[0].trim(),eventType:parseInt(p[1]),eventCode:parseInt(p[2]),date:p[3],time:p[4],accumMiles:p[5],accumHours:p[6],recordOrigin:parseInt(p[7]),lineDataCheck:p[8]||''});}
  }
  // Logins
  const lRaw=segments['ELD Login/Logout Report:'];
  if(lRaw){
    const lines=lRaw.split('\n').filter(l=>l.trim());
    for(const line of lines){const p=line.split(',');if(p.length<7)continue;data.logins.push({seqId:p[0].trim(),eventCode:parseInt(p[1]),userId:p[2],date:p[3],time:p[4],accumMiles:p[5],accumHours:p[6],lineDataCheck:p[7]||''});}
  }
  // Engines
  const engRaw=segments['CMV Engine Power-Up and Shut Down Activity:'];
  if(engRaw){
    const lines=engRaw.split('\n').filter(l=>l.trim());
    for(const line of lines){const p=line.split(',');if(p.length<12)continue;data.engines.push({seqId:p[0].trim(),eventCode:parseInt(p[1]),date:p[2],time:p[3],accumMiles:p[4],accumHours:p[5],lat:p[6],lon:p[7],dotNumber:p[8],vin:p[9],truckNumber:p[10],shippingId:p[11],lineDataCheck:p[12]||''});}
  }
  const uiRaw=segments['Unidentified Driver Profile Records:'];
  if(uiRaw&&uiRaw.length>0) data.unidentified=uiRaw;
  const efRaw=segments['End of File:'];
  if(efRaw) data.checksum=efRaw.trim();
  return data;
}

// ========== RENDERERS ==========
function renderHeader(h){
  const initials=(h.firstName[0]||'')+(h.lastName[0]||'');
  document.getElementById('header-card').innerHTML=`
    <div class="header-top">
      <div class="header-driver">
        <div class="driver-avatar">${initials}</div>
        <div>
          <div class="driver-name">${h.firstName} ${h.lastName}</div>
          <div class="driver-carrier">${h.carrierName}</div>
        </div>
      </div>
      <div class="header-eld-badge">${h.eldFirmware} / ${h.eldProvider}</div>
    </div>
    <div class="header-grid">
      <div class="header-field"><label>USDOT</label><span>${h.dotNumber}</span></div>
      <div class="header-field"><label>VIN</label><span>${h.vin}</span></div>
      <div class="header-field"><label>Truck #</label><span>${h.truckNumber}</span></div>
      <div class="header-field"><label>Trailer #</label><span>${h.trailerNumber||'N/A'}</span></div>
      <div class="header-field"><label>DL State</label><span>${h.dlState}</span></div>
      <div class="header-field"><label>DL Number</label><span>${h.dlNumber}</span></div>
      <div class="header-field"><label>Multi-Day</label><span>${h.multiDay}-day</span></div>
      <div class="header-field"><label>Timezone</label><span>${tzLabel()}</span></div>
      <div class="header-field"><label>ELD ID</label><span>${h.eldId}</span></div>
      <div class="header-field"><label>Shipping Doc</label><span>${h.shippingId||'N/A'}</span></div>
      <div class="header-field"><label>Co-Driver</label><span>${h.codriverFlag==='0'?'None':h.codriverFirst+' '+h.codriverLast}</span></div>
      <div class="header-field"><label>File Checksum</label><span>${h.eldRegistration}</span></div>
    </div>`;
}

function renderSummary(data){
  const ae=data.events.filter(e=>e.recordStatus===1);
  const d=ae.filter(e=>e.eventType===1&&e.eventCode===3).length;
  const on=ae.filter(e=>e.eventType===1&&e.eventCode===4).length;
  const off=ae.filter(e=>e.eventType===1&&e.eventCode===1).length;
  const sl=ae.filter(e=>e.eventType===1&&e.eventCode===2).length;
  const cards=[
    {n:data.events.length,l:'Events',c:'var(--ig-fg1)',bc:'var(--ig-primary)'},
    {n:d,l:'Driving',c:'var(--driving)',bc:'var(--driving)'},
    {n:on,l:'On Duty',c:'var(--on-duty)',bc:'var(--on-duty)'},
    {n:off,l:'Off Duty',c:'var(--off-duty)',bc:'var(--off-duty)'},
    {n:sl,l:'Sleeper',c:'var(--sleeper)',bc:'var(--sleeper)'},
    {n:data.certifications.length,l:'Certs',c:'var(--cert)',bc:'var(--cert)'},
    {n:data.malfunctions.length,l:'Malf/Diag',c:'var(--malf)',bc:'var(--malf)'},
  ];
  document.getElementById('summary-row').innerHTML=cards.map(c=>
    `<div class="summary-card"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:${c.bc};opacity:.7"></div><div class="num" style="color:${c.c}">${c.n}</div><div class="lbl">${c.l}</div></div>`
  ).join('');
}

function renderCertifications(certs){
  if(!certs.length)return'<div class="empty">No certification records</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>Seq</th><th>Action</th><th>Action Date</th><th>Action Time</th><th>Day Certified</th><th>Code</th></tr></thead>
    <tbody>${certs.map(c=>{
      const css=c.actionType===1?'status-certify':'status-recertify';
      return`<tr><td class="coord">${c.seqId}</td><td><span class="status-badge ${css}">${CERT_ACTIONS[c.actionType]||c.actionType}</span></td><td>${fmtLocalDate(c.date,c.time)}</td><td>${fmtLocalTime(c.date,c.time)}</td><td><span class="cert-day">${fmtDate(c.certifiedDate)}</span></td><td class="coord">${c.actionCode}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderEvents(events,annotations){
  if(!events.length)return'<div class="empty">No events</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>Seq</th><th>Type</th><th>Status</th><th>Record</th><th>Origin</th><th>Date</th><th>Time</th><th>Miles</th><th>Hours</th><th>Location</th><th>Annotation</th></tr></thead>
    <tbody>${events.map(e=>{
      const tl=EVENT_TYPES[e.eventType]||e.eventType;
      let cl=e.eventCode,cc='';
      if(e.eventType===1){cl=DUTY_CODES[e.eventCode]||e.eventCode;cc='status-'+(DUTY_CSS[e.eventCode]||'');}
      const sl=RECORD_STATUS[e.recordStatus]||e.recordStatus;
      const sc=e.recordStatus===1?'status-active':'status-inactive';
      const ol=RECORD_ORIGIN[e.recordOrigin]||e.recordOrigin;
      const oc=ORIGIN_CSS[e.recordOrigin]||'';
      const ann=annotations[e.seqId];
      return`<tr>
        <td class="coord">${e.seqId}</td><td>${tl}</td>
        <td>${cc?`<span class="status-badge ${cc}">${cl}</span>`:cl}</td>
        <td><span class="status-badge ${sc}">${sl}</span></td>
        <td><span class="${oc}">${ol}</span></td>
        <td>${fmtLocalDate(e.date,e.time)}</td><td>${fmtLocalTime(e.date,e.time)}</td>
        <td class="coord">${e.accumMiles}</td><td class="coord">${e.accumHours}</td>
        <td class="coord">${fmtCoord(e.lat)}, ${fmtCoord(e.lon)}</td>
        <td>${ann?`<span class="annotation-text">${ann.comment}</span>`:''}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderAnnotations(annotations){
  const keys=Object.keys(annotations);
  if(!keys.length)return'<div class="empty">No annotations</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>Event Seq</th><th>User</th><th>Comment</th><th>Date</th><th>Time</th></tr></thead>
    <tbody>${keys.map(k=>{const a=annotations[k];return`<tr><td class="coord">${k}</td><td class="coord">${a.userId}</td><td>${a.comment}</td><td>${fmtLocalDate(a.date,a.time)}</td><td>${fmtLocalTime(a.date,a.time)}</td></tr>`;}).join('')}</tbody></table></div>`;
}

function renderMalfunctions(malfs){
  if(!malfs.length)return'<div class="empty">No malfunction/diagnostic events</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>Seq</th><th>Type</th><th>Code</th><th>Date</th><th>Time</th><th>Miles</th><th>Hours</th><th>Origin</th></tr></thead>
    <tbody>${malfs.map(m=>{
      const tl=MALF_EVENT_TYPES[m.eventType]||m.eventType;
      const tc=m.eventType===4?'malf-malfunction':'malf-diagnostic';
      let cl=m.eventCode;
      if(m.eventType===3)cl=MALF_CODES_DIAG[m.eventCode]||m.eventCode;
      if(m.eventType===4)cl=MALF_CODES_MALF[m.eventCode]||m.eventCode;
      return`<tr><td class="coord">${m.seqId}</td><td><span class="${tc}">${tl}</span></td><td>${cl}</td><td>${fmtLocalDate(m.date,m.time)}</td><td>${fmtLocalTime(m.date,m.time)}</td><td class="coord">${m.accumMiles}</td><td class="coord">${m.accumHours}</td><td>${RECORD_ORIGIN[m.recordOrigin]||m.recordOrigin}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderLogins(logins){
  if(!logins.length)return'<div class="empty">No login/logout events</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>Seq</th><th>Action</th><th>User</th><th>Date</th><th>Time</th><th>Miles</th><th>Hours</th></tr></thead>
    <tbody>${logins.map(l=>{
      const css=l.eventCode===1?'status-active':'status-inactive';
      return`<tr><td class="coord">${l.seqId}</td><td><span class="status-badge ${css}">${LOGIN_TYPES[l.eventCode]||l.eventCode}</span></td><td class="coord">${l.userId}</td><td>${fmtLocalDate(l.date,l.time)}</td><td>${fmtLocalTime(l.date,l.time)}</td><td class="coord">${l.accumMiles}</td><td class="coord">${l.accumHours}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderEngines(engines){
  if(!engines.length)return'<div class="empty">No engine activity</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>Seq</th><th>Action</th><th>Date</th><th>Time</th><th>Miles</th><th>Hours</th><th>Location</th><th>VIN</th><th>Truck</th></tr></thead>
    <tbody>${engines.map(e=>{
      const css=e.eventCode===3?'status-active':'status-inactive';
      return`<tr><td class="coord">${e.seqId}</td><td><span class="status-badge ${css}">${ENGINE_TYPES[e.eventCode]||('Code '+e.eventCode)}</span></td><td>${fmtLocalDate(e.date,e.time)}</td><td>${fmtLocalTime(e.date,e.time)}</td><td class="coord">${e.accumMiles}</td><td class="coord">${e.accumHours}</td><td class="coord">${fmtCoord(e.lat)}, ${fmtCoord(e.lon)}</td><td class="coord">${e.vin}</td><td class="coord">${e.truckNumber}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderUsers(users){
  if(!users.length)return'<div class="empty">No users</div>';
  return`<div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>Role</th><th>Name</th></tr></thead>
    <tbody>${users.map(u=>`<tr><td class="coord">${u.userId}</td><td>${u.role}</td><td>${u.lastName}, ${u.firstName}</td></tr>`).join('')}</tbody></table></div>`;
}

let _tlData=null;
let _tlAnnotations=null;

function renderTimeline(events,annotations){
  const active=events.filter(e=>e.recordStatus===1&&e.eventType===1).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:1);
  if(!active.length)return'<div class="empty">No timeline data</div>';
  const days={};
  active.forEach(e=>{
    const localD=localDateStr(e.date,e.time);
    if(!days[localD])days[localD]=[];
    days[localD].push(e);
  });
  const sortedDays=Object.keys(days).sort();
  _tlData={days,sortedDays,annotations:annotations||{}};

  const legendItems=[
    {label:'Off Duty',color:'var(--off-duty)',desc:'Not working, personal time'},
    {label:'Sleeper Berth',color:'var(--sleeper)',desc:'Rest period in sleeper'},
    {label:'Driving',color:'var(--driving)',desc:'Operating the CMV'},
    {label:'On Duty',color:'var(--on-duty)',desc:'Working but not driving'},
  ];
  const legendHtml=legendItems.map(l=>
    `<div class="legend-item" title="${l.desc}"><div class="legend-swatch" style="background:${l.color}"></div>${l.label}</div>`
  ).join('');

  return`<div class="timeline-container">
    <div class="timeline-header">
      <div class="timeline-header-left">
        <div class="timeline-title">Duty status timeline</div>
        <div class="view-toggle">
          <button class="active" onclick="showTotalView(this)">Total</button>
          <button onclick="showDailyView(this)">Daily</button>
        </div>
      </div>
      <div class="timeline-legend">${legendHtml}</div>
    </div>
    <div id="tl-total">${renderTotalView(days,sortedDays)}</div>
    <div id="tl-daily" style="display:none"></div>
  </div>`;
}

function renderTotalView(days,sortedDays){
  const hours=[0,3,6,9,12,15,18,21,24];
  let axisHtml=hours.map(h=>{
    const pct=(h/24*100).toFixed(2);
    return`<span class="timeline-axis-tick" style="left:${pct}%">${String(h).padStart(2,'0')}:00</span><span class="timeline-axis-line" style="left:${pct}%"></span>`;
  }).join('');
  let rowsHtml='';
  for(const day of sortedDays){
    const evts=days[day];
    const gridlines=[6,12,18].map(h=>`<div class="timeline-gridline" style="left:${(h/24*100).toFixed(2)}%"></div>`).join('');
    let segs='';
    for(let i=0;i<evts.length;i++){
      const e=evts[i];
      const startMin=localTimeToMinutes(e.date,e.time);
      const endMin=(i+1<evts.length)?localTimeToMinutes(evts[i+1].date,evts[i+1].time):1440;
      const dur=Math.max(0,endMin-startMin);
      const leftPct=(startMin/1440*100).toFixed(2);
      const widthPct=(dur/1440*100).toFixed(2);
      const color=DUTY_COLORS[e.eventCode]||'var(--ig-fg3)';
      const hex=DUTY_HEX[e.eventCode]||'#5C6478';
      const label=DUTY_CODES[e.eventCode]||'Unknown';
      const localT=fmtLocalTimeShort(e.date,e.time);
      const nextT=(i+1<evts.length)?fmtLocalTimeShort(evts[i+1].date,evts[i+1].time):'24:00';
      segs+=`<div class="timeline-segment" style="left:${leftPct}%;width:${widthPct}%;background:${color}">
        <div class="timeline-tooltip">
          <div class="tt-status"><span class="tt-dot" style="background:${hex}"></span>${label}</div>
          <div class="tt-detail">${localT} - ${nextT}<br>Duration: ${durationStr(dur)}<br>${fmtCoord(e.lat)!=='-'?'Location: '+fmtCoord(e.lat)+', '+fmtCoord(e.lon):''}</div>
        </div>
      </div>`;
    }
    rowsHtml+=`<div class="timeline-day"><div class="timeline-label">${fmtDateShort(day)}</div><div class="timeline-bar">${gridlines}${segs}</div></div>`;
  }
  return`<div class="timeline-axis" style="margin-left:100px;position:relative;height:20px">${axisHtml}</div>${rowsHtml}`;
}

function showTotalView(btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tl-total').style.display='';
  document.getElementById('tl-daily').style.display='none';
}

function showDailyView(btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tl-total').style.display='none';
  const dailyEl=document.getElementById('tl-daily');
  dailyEl.style.display='';
  if(!dailyEl.dataset.init){
    dailyEl.dataset.init='1';
    renderDailyNav(0);
  }
}

function renderDailyNav(idx){
  if(!_tlData)return;
  const{days,sortedDays,annotations}=_tlData;
  const dailyEl=document.getElementById('tl-daily');
  const day=sortedDays[idx];
  const evts=days[day];

  let navHtml=sortedDays.map((d,i)=>
    `<button class="${i===idx?'active':''}" onclick="renderDailyNav(${i})">${fmtDateShort(d)}</button>`
  ).join('');
  const prevBtn=idx>0?`<button onclick="renderDailyNav(${idx-1})">&#9664;</button>`:`<button disabled>&#9664;</button>`;
  const nextBtn=idx<sortedDays.length-1?`<button onclick="renderDailyNav(${idx+1})">&#9654;</button>`:`<button disabled>&#9654;</button>`;

  const gridlines=[3,6,9,12,15,18,21].map(h=>
    `<div class="timeline-gridline" style="left:${(h/24*100).toFixed(2)}%"></div>`
  ).join('');
  let segs='';
  for(let i=0;i<evts.length;i++){
    const e=evts[i];
    const startMin=localTimeToMinutes(e.date,e.time);
    const endMin=(i+1<evts.length)?localTimeToMinutes(evts[i+1].date,evts[i+1].time):1440;
    const dur=Math.max(0,endMin-startMin);
    const leftPct=(startMin/1440*100).toFixed(2);
    const widthPct=(dur/1440*100).toFixed(2);
    const color=DUTY_COLORS[e.eventCode]||'var(--ig-fg3)';
    const hex=DUTY_HEX[e.eventCode]||'#5C6478';
    const label=DUTY_CODES[e.eventCode]||'Unknown';
    const localT=fmtLocalTimeShort(e.date,e.time);
    const nextT=(i+1<evts.length)?fmtLocalTimeShort(evts[i+1].date,evts[i+1].time):'24:00';
    segs+=`<div class="timeline-segment" style="left:${leftPct}%;width:${widthPct}%;background:${color}">
      <div class="timeline-tooltip">
        <div class="tt-status"><span class="tt-dot" style="background:${hex}"></span>${label}</div>
        <div class="tt-detail">${localT} - ${nextT}<br>Duration: ${durationStr(dur)}<br>${fmtCoord(e.lat)!=='-'?'Location: '+fmtCoord(e.lat)+', '+fmtCoord(e.lon):''}</div>
      </div>
    </div>`;
  }

  const axisLabels=[0,3,6,9,12,15,18,21,24].map(h=>
    `<span>${String(h).padStart(2,'0')}:00</span>`
  ).join('');

  let eventRows='';
  for(let i=0;i<evts.length;i++){
    const e=evts[i];
    const startMin=localTimeToMinutes(e.date,e.time);
    const endMin=(i+1<evts.length)?localTimeToMinutes(evts[i+1].date,evts[i+1].time):1440;
    const dur=Math.max(0,endMin-startMin);
    const label=DUTY_CODES[e.eventCode]||'Unknown';
    const css='status-'+(DUTY_CSS[e.eventCode]||'');
    const ann=annotations[e.seqId];
    eventRows+=`<div class="daily-event-row">
      <div class="daily-event-time">${fmtLocalTimeShort(e.date,e.time)}</div>
      <div class="daily-event-dur">${durationStr(dur)}</div>
      <div class="daily-event-status"><span class="status-badge ${css}">${label}</span></div>
      <div class="daily-event-loc">${fmtCoord(e.lat)!=='-'?fmtCoord(e.lat)+', '+fmtCoord(e.lon):''}</div>
      <div class="daily-event-ann">${ann?ann.comment:''}</div>
    </div>`;
  }

  const totals={1:0,2:0,3:0,4:0};
  for(let i=0;i<evts.length;i++){
    const startMin=localTimeToMinutes(evts[i].date,evts[i].time);
    const endMin=(i+1<evts.length)?localTimeToMinutes(evts[i+1].date,evts[i+1].time):1440;
    totals[evts[i].eventCode]=(totals[evts[i].eventCode]||0)+Math.max(0,endMin-startMin);
  }
  const summaryItems=[
    {label:'Off Duty',code:1,color:'var(--off-duty)'},
    {label:'Sleeper',code:2,color:'var(--sleeper)'},
    {label:'Driving',code:3,color:'var(--driving)'},
    {label:'On Duty',code:4,color:'var(--on-duty)'},
  ];
  const summaryHtml=summaryItems.map(s=>
    `<div class="daily-summary-item">
      <div class="daily-summary-swatch" style="background:${s.color}"></div>
      <div class="daily-summary-label">${s.label}</div>
      <div class="daily-summary-value">${durationStr(totals[s.code]||0)}</div>
    </div>`
  ).join('');

  dailyEl.innerHTML=`
    <div class="daily-nav">${prevBtn}${navHtml}${nextBtn}</div>
    <div class="daily-detail">
      <div class="daily-bar-wrap">
        <div class="daily-bar">${gridlines}${segs}</div>
        <div class="daily-axis">${axisLabels}</div>
      </div>
      <div class="daily-events-list">${eventRows}</div>
      <div class="daily-summary">${summaryHtml}</div>
    </div>`;
}

// ========== TAB SYSTEM ==========
function buildTabs(data){
  const tabDefs=[
    {id:'timeline',label:'Timeline',color:'var(--ig-primary)',count:''},
    {id:'cert',label:'Certifications',color:'var(--cert)',count:data.certifications.length},
    {id:'events',label:'Events',color:'var(--ig-fg1)',count:data.events.length},
    {id:'annotations',label:'Annotations',color:'var(--ig-fg2)',count:Object.keys(data.annotations).length},
    {id:'malfunctions',label:'Malf / Diag',color:'var(--malf)',count:data.malfunctions.length},
    {id:'logins',label:'Login / Logout',color:'var(--login)',count:data.logins.length},
    {id:'engines',label:'Engine',color:'var(--engine)',count:data.engines.length},
    {id:'users',label:'Users',color:'var(--ig-fg3)',count:data.users.length},
  ];
  document.getElementById('tabs').innerHTML=tabDefs.map((t,i)=>
    `<div class="tab ${i===0?'active':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">
      <span class="dot" style="background:${t.color}"></span>${t.label}${t.count!==''?`<span class="badge">${t.count}</span>`:''}
    </div>`
  ).join('');
  document.getElementById('tab-panels').innerHTML=`
    <div class="tab-panel active" id="panel-timeline">${renderTimeline(data.events,data.annotations)}</div>
    <div class="tab-panel" id="panel-cert">${renderCertifications(data.certifications)}</div>
    <div class="tab-panel" id="panel-events">${renderEvents(data.events,data.annotations)}</div>
    <div class="tab-panel" id="panel-annotations">${renderAnnotations(data.annotations)}</div>
    <div class="tab-panel" id="panel-malfunctions">${renderMalfunctions(data.malfunctions)}</div>
    <div class="tab-panel" id="panel-logins">${renderLogins(data.logins)}</div>
    <div class="tab-panel" id="panel-engines">${renderEngines(data.engines)}</div>
    <div class="tab-panel" id="panel-users">${renderUsers(data.users)}</div>`;
}
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
}

// ========== FILE HANDLING ==========
function handleFile(file){
  const reader=new FileReader();
  reader.onload=function(ev){
    const data=parseEROD(ev.target.result);
    document.getElementById('drop-zone').style.display='none';
    document.getElementById('content').style.display='block';
    document.getElementById('file-name-display').textContent=file.name;
    renderHeader(data.header);renderSummary(data);buildTabs(data);
  };
  reader.readAsText(file);
}
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0]);});
</script>
